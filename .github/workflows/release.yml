name: Release

# Si attiva quando pubblichi un tag di versione (es. v2.0.0):
# compila l'exe Windows, prepara l'archivio Linux e crea la Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necessario per creare la release

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica che il tag corrisponda a version.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(python3 -c "import re;print(re.search(r'__version__ = \"(.*?)\"', open('version.py').read()).group(1))")
          echo "tag=$TAG version.py=$APP"
          if [ "$TAG" != "$APP" ]; then
            echo "::error::Il tag v$TAG non corrisponde a version.py ($APP)"; exit 1
          fi

  windows:
    runs-on: windows-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa dipendenze
        run: pip install -r requirements.txt pyinstaller
      - name: Compila con PyInstaller
        run: pyinstaller dxcluster_map.spec --noconfirm
      - name: Crea zip Windows
        shell: pwsh
        run: Compress-Archive -Path dist/DXClusterMap/* -DestinationPath "DXClusterMap-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: DXClusterMap-${{ github.ref_name }}-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4
      - name: Crea archivio sorgenti Linux
        run: |
          git archive --format=tar.gz --prefix="DXClusterMap-${{ github.ref_name }}/" \
            -o "DXClusterMap-${{ github.ref_name }}-linux.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: linux-targz
          path: DXClusterMap-${{ github.ref_name }}-linux.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Crea la Release su GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DXClusterMap-*-windows-x64.zip
            DXClusterMap-*-linux.tar.gz
