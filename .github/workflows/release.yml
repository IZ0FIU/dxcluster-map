name: Release

# Si attiva quando pubblichi un tag di versione (es. v2.0.0):
# compila l'exe Windows, prepara l'archivio Linux e crea la Release.
# Con workflow_dispatch si può provare la build senza pubblicare nulla.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # necessario per creare la release

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica che il tag corrisponda a version.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(python3 -c "import re;print(re.search(r'__version__ = \"(.*?)\"', open('version.py').read()).group(1))")
          echo "tag=$TAG version.py=$APP"
          if [ "$TAG" != "$APP" ]; then
            echo "::error::Il tag v$TAG non corrisponde a version.py ($APP)"; exit 1
          fi

  windows:
    runs-on: windows-latest
    needs: check-version
    if: ${{ !cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa dipendenze
        run: pip install -r requirements.txt pyinstaller
      - name: Compila con PyInstaller
        run: pyinstaller dxcluster_map.spec --noconfirm
      - name: Smoke test del pacchetto
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QTWEBENGINE_DISABLE_SANDBOX = '1'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu --no-sandbox --in-process-gpu'
          $p = Start-Process -FilePath "dist\DXClusterMap\DXClusterMap.exe" `
                 -ArgumentList "--smoke-test" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "smoke test: timeout"; exit 1 }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Write-Host "Smoke test OK"
      - name: Determina versione
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            # build di prova (workflow_dispatch): versione da version.py
            $version = (Select-String -Path version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
            $version = "$version-dev"
          }
          Write-Host "versione: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Crea zip Windows
        shell: pwsh
        run: Compress-Archive -Path dist/DXClusterMap/* -DestinationPath "DXClusterMap-v${{ steps.ver.outputs.version }}-windows-x64.zip"
      - name: Crea installer Windows (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "installer\dxcluster_map.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: DXClusterMap-*-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist_installer/DXClusterMap-*-windows-setup.exe

  linux:
    runs-on: ubuntu-latest
    needs: check-version
    if: ${{ !cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - name: Crea archivio sorgenti Linux
        run: |
          git archive --format=tar.gz --prefix="DXClusterMap-${{ github.ref_name }}/" \
            -o "DXClusterMap-${{ github.ref_name }}-linux.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: linux-targz
          path: DXClusterMap-*-linux.tar.gz

  linux-appimage:
    # Compilato su Ubuntu 22.04 (glibc 2.35) perché l'AppImage giri anche
    # sulle distribuzioni più vecchie.
    runs-on: ubuntu-22.04
    needs: check-version
    if: ${{ !cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libfuse2 \
            libgl1-mesa-dri xvfb \
            desktop-file-utils appstream
      - name: Installa dipendenze Python
        run: pip install -r requirements.txt pyinstaller
      - name: Compila con PyInstaller
        run: pyinstaller dxcluster_map.spec --noconfirm
      - name: Smoke test del bundle
        run: |
          QT_QPA_PLATFORM=offscreen QTWEBENGINE_DISABLE_SANDBOX=1 \
          QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu --no-sandbox --in-process-gpu" \
            dist/DXClusterMap/DXClusterMap --smoke-test
      - name: Determina versione
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            V=$(python3 -c "import re;print(re.search(r'__version__ = \"(.*?)\"', open('version.py').read()).group(1))")
            echo "version=$V-dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Crea AppImage
        run: ./packaging/build_appimage.sh "${{ steps.ver.outputs.version }}"
      - name: Verifica AppImage
        run: |
          APPIMAGE=$(ls dist/DXClusterMap-*-x86_64.AppImage)
          "$APPIMAGE" --appimage-extract >/dev/null
          desktop-file-validate squashfs-root/*.desktop
          appstreamcli validate --no-net \
            squashfs-root/usr/share/metainfo/*.metainfo.xml
          # I backend X11 e Wayland devono usare le Qt incluse nell'AppImage,
          # non quelle (di versione diversa) del sistema.
          for p in \
            squashfs-root/usr/bin/_internal/PySide6/Qt/plugins/platforms/libqxcb.so \
            squashfs-root/usr/bin/_internal/PySide6/Qt/plugins/platforms/libqwayland.so; do
            if ldd "$p" | grep -q 'not found'; then
              echo "ERRORE: dipendenze mancanti per $p"
              ldd "$p"
              exit 1
            fi
          done
          echo "→ smoke test offscreen"
          QT_QPA_PLATFORM=offscreen QTWEBENGINE_DISABLE_SANDBOX=1 \
            QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu --no-sandbox --in-process-gpu" \
            ./squashfs-root/AppRun --smoke-test
          echo "→ smoke test X11 (Xvfb)"
          xvfb-run -a env QT_QPA_PLATFORM=xcb QTWEBENGINE_DISABLE_SANDBOX=1 \
            QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu --no-sandbox --in-process-gpu" \
            ./squashfs-root/AppRun --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/DXClusterMap-*-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, linux, linux-appimage]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Crea la Release su GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DXClusterMap-*-windows-x64.zip
            DXClusterMap-*-windows-setup.exe
            DXClusterMap-*-linux.tar.gz
            DXClusterMap-*-x86_64.AppImage
